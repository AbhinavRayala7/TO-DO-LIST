<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>TaskFlow • Modern To-Do List</title>
  <link rel="stylesheet" href="style.css"/>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <main class="app-card">
    <header class="app-header">
      <h1>My Tasks</h1>
      <p id="dateDisplay" class="date-subtitle"></p>
    </header>

    <form id="taskForm" class="input-group">
      <input 
        type="text" 
        id="taskInput" 
        placeholder="What needs to be done?" 
        autocomplete="off"
        required 
      />
      <button type="submit" id="addBtn">Add Task</button>
    </form>

    <div class="filters">
      <div class="filter-buttons">
        <button class="filter-btn active" data-filter="all">All</button>
        <button class="filter-btn" data-filter="active">Active</button>
        <button class="filter-btn" data-filter="completed">Completed</button>
      </div>
      <span id="taskCounter" class="task-counter">0 tasks remaining</span>
    </div>

    <ul id="taskList" class="task-list"></ul>

    <footer class="app-footer">
      <button id="clearCompletedBtn" class="clear-btn">Clear Completed</button>
    </footer>
  </main>
  <div class="site-banner">
    Made by <a href="https://github.com/AbhinavRayala7" target="_blank" rel="noopener noreferrer">Abhi</a>
  </div>
  <script src="script.js"></script>

  <script src="script.js"></script>

  <script src="script.js"></script>
</body>
</html>
